# Application theme — edit colors, fonts, and widget styles here (like CSS).

[colors]
background = "#051430"
text = "#E8E8E8"
accent = "#3399E6"
panel = "#0a2540"

[fonts]
family = "Proportional"
size = 16.0
heading_scale = 1.75

[widgets.button]
bg = "#3399E6"
text = "#FFFFFF"
hover_bg = "#4dabf0"
rounding = 6.0

[widgets.checkbox]
bg = "#1a3a5c"
stroke = "#3399E6"
